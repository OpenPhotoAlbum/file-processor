template_name: Communication Flow Test
template_id: communication-flow-test
template_version: '1.0'
description: Test complete communication flow through all 6 specialists using project-related jokes
version: '1.0'
use_cases:
- Testing task chain communication system after changes
- Validating orchestration system health
- QA validation of multi-Claude workflows
variables:
  test_id: comm-flow-test
  initiated_by: stephen
  test_purpose: validate communication system
# PRIORITY FIELD (required when creating task chain)
# Test tasks usually MEDIUM unless testing critical system fixes
# priority: MEDIUM  # Uncomment and set when creating task from template
success_criteria:
- Each specialist successfully receives their task assignment
- Each specialist tells a project-related joke
- Stephen responds to each joke (acceptance criteria)
- Communication flows properly from phase to phase
- Task chain completes full round-trip back to Architect
phases:
- phase_id: architect_initiation
  phase_name: Architect Test Initiation
  assigned_to: claude-1
  depends_on: []
  description: Architect initiates communication test by creating task assignments
    for all specialists
  deliverable: Create joke request tasks for all specialists + mark this phase complete
  estimated_duration: 5 minutes
  status: pending
- phase_id: builder_joke
  phase_name: Builder Code Joke
  assigned_to: claude-2
  depends_on:
  - architect_initiation
  description: Builder tells a code/implementation joke about the media processing
    project
  deliverable: Tell joke + wait for Stephen's response + mark phase complete after
    response received
  acceptance_criteria: Stephen's response to the joke
  estimated_duration: 5 minutes
  status: waiting
- phase_id: guardian_joke
  phase_name: Guardian Testing Joke
  assigned_to: claude-3
  depends_on:
  - builder_joke
  description: Guardian tells a testing/quality joke about the media processing project
  deliverable: Tell joke + wait for Stephen's response + mark phase complete after
    response received
  acceptance_criteria: Stephen's response to the joke
  estimated_duration: 5 minutes
  status: waiting
- phase_id: chronicler_joke
  phase_name: Chronicler Documentation Joke
  assigned_to: claude-4
  depends_on:
  - guardian_joke
  description: Chronicler tells a documentation joke about the media processing project
  deliverable: Tell joke + wait for Stephen's response + mark phase complete after
    response received
  acceptance_criteria: Stephen's response to the joke
  estimated_duration: 5 minutes
  status: waiting
- phase_id: curator_joke
  phase_name: Curator Photo Processing Joke
  assigned_to: claude-5
  depends_on:
  - chronicler_joke
  description: Curator tells a photo processing joke about the heritage photo project
  deliverable: Tell joke + wait for Stephen's response + mark phase complete after
    response received
  acceptance_criteria: Stephen's response to the joke
  estimated_duration: 5 minutes
  status: waiting
- phase_id: data_joke
  phase_name: Data Specialist Database Joke
  assigned_to: claude-6
  depends_on:
  - curator_joke
  description: Data specialist tells a database joke about protecting 150k heritage
    photos
  deliverable: Tell joke + wait for Stephen's response + mark phase complete after
    response received
  acceptance_criteria: Stephen's response to the joke
  estimated_duration: 5 minutes
  status: waiting
- phase_id: architect_completion
  phase_name: Architect Test Completion
  assigned_to: claude-1
  depends_on:
  - data_joke
  description: Architect receives all joke completions and closes the communication
    test
  deliverable: Verify all specialists completed their jokes + close task chain
  estimated_duration: 5 minutes
  status: waiting
template_notes:
- This is a DIAGNOSTIC template - no code changes allowed
- Each specialist must wait for Stephen's response before marking complete
- Jokes should relate to each specialist's domain in the project
- Use this template to test communication flow after system changes
- QA can use this as part of orchestration system validation
- If any phase fails, it indicates a communication system issue
example_usage:
  test_id: comm-test-001
  initiated_by: Stephen
  test_purpose: Validate communication system after Claude 6 task awareness issue
