# Research Driven Development Chain Template
template_name: "research_driven_development"
description: "Research → Planning → Implementation → QA workflow for complex features"
version: "1.0"

# Phases for research-driven development
phases:
  - phase_id: "research_analysis"
    phase_name: "Research and Analysis"
    assigned_to: "claude-1"
    status: "pending"
    depends_on: []
    completion_evidence: "Research findings documented, technical approach defined, risks identified"
    estimated_duration: "2-3 hours"
    
  - phase_id: "implementation_planning"
    phase_name: "Implementation Planning"
    assigned_to: "claude-1"
    status: "pending"
    depends_on: ["research_analysis"]
    completion_evidence: "Architecture design complete, implementation plan documented, success criteria defined"
    estimated_duration: "1-2 hours"
    
  - phase_id: "implementation"
    phase_name: "Feature Implementation"
    assigned_to: "claude-2"
    status: "pending"
    depends_on: ["implementation_planning"]
    completion_evidence: "Feature implemented per specification, builds successfully, basic testing complete"
    estimated_duration: "3-6 hours"
    
  - phase_id: "qa_validation"
    phase_name: "Quality Assurance Validation"
    assigned_to: "claude-3"
    status: "pending"
    depends_on: ["implementation"]
    completion_evidence: "Comprehensive testing complete, quality gates pass, performance validated"
    estimated_duration: "2-3 hours"

# Success criteria for entire chain
success_criteria:
  - "Research findings validate approach"
  - "Implementation matches architectural design"
  - "All quality gates pass"
  - "Feature ready for production use"

# Variables for research-driven development
variables:
  research_topic: "{{RESEARCH_TOPIC}}"
  complexity_level: "{{COMPLEXITY_LEVEL}}"
  stakeholder: "{{STAKEHOLDER}}"
  success_metrics: "{{SUCCESS_METRICS}}"