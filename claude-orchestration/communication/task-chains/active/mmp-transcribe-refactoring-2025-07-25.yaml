template_notes:
- Architect designs comprehensive system including AI enhancement workflow
- Builder implements in phases: core functionality, then AI enhancement
- Guardian ensures all transcription modes work reliably
- Chronicler documents the enhanced capabilities thoroughly
- Curator validates real-world heritage preservation effectiveness
critical_constraints:
- Must maintain backward compatibility with existing workflows
- File size limits: No file >500 lines (STRICT zone enforcement)
- Graceful degradation if whisper.cpp or Claude API unavailable
- Heritage media safety: No data loss or corruption
- Performance: Must handle large batches efficiently
technical_context:
- Current transcribe-audio.sh uses whisper.cpp directly
- OCR capability needed for image text extraction
- AI enhancement compares OCR results with Claude's image analysis
- Support for correcting problematic or missing transcriptions
- Output formats: txt, srt, vtt, json
- Language detection and specification support
ai_enhancement_details:
- --ai-enhance flag triggers Claude image analysis (images only, not video)
- Claude reads image directly to understand text content
- System compares OCR output with Claude's interpretation
- Replaces missing or problematic transcriptions with Claude's analysis
- Particularly useful for handwritten text, damaged photos, or complex layouts
- Provides context-aware transcription improvements
integration_points:
- MMP CLI modular structure (cli/commands/transcribe.ts)
- Whisper.cpp installation for audio/video
- OCR library integration for image text extraction
- Claude API for AI-enhanced image analysis
- Output directory management and file naming
- Progress tracking with MMP output system
- Consistent error handling across all modes
