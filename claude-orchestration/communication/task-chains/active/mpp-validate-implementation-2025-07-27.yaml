name: "MPP Validate Implementation"
id: "mpp-validate-implementation-2025-07-27"
created: "2025-07-27T19:30:00Z"
priority: "HIGH"
status: "active"
estimated_duration: "2-3 weeks"

description: |
  Implement `mpp validate` command with rule-based photo validation and auto-fix capabilities.
  
  Core Features:
  - Rule-based validation for post-digital and heritage photos
  - EXIF-based photo type detection 
  - Metadata sidecar validation
  - Weighted scoring system with configurable thresholds
  - Auto-fix capabilities for common issues
  - Integration with existing pipeline-cli infrastructure

phases:
  # Phase 1: Foundation - Validation Service Core
  - id: "foundation_validation_service"
    phase_name: "Foundation Validation Service"
    assigned_to: "claude-2"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "3-4 days"
    depends_on: []
    
    description: |
      Build core ValidationService that can detect photo types and run basic validation rules.
      
      Implementation Focus:
      - Photo type detection (post-digital vs heritage-scan) using existing router logic
      - Basic rule validation framework
      - Simple pass/fail validation for critical requirements
      - Integration with existing pipeline-cli services
    
    deliverables:
      - "pipeline-cli/src/services/validation/ValidationService.ts"
      - "pipeline-cli/src/utils/validation-rules.ts" 
      - Basic rule definitions for post-digital photos
      - Unit tests for ValidationService core functionality
    
    acceptance_criteria:
      - Can detect photo type from EXIF digitalSourceType
      - Can validate has_metadata_sidecar rule
      - Can validate sidecar_schema_valid rule  
      - Can validate basic EXIF requirements
      - All unit tests pass
      - ESLint and TypeScript compliance

  # QA Phase 1: Foundation Testing
  - id: "qa_foundation_validation"
    phase_name: "QA Foundation Validation"
    assigned_to: "claude-3"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "1-2 days"
    depends_on: ["foundation_validation_service"]
    
    description: |
      Comprehensive testing of ValidationService foundation with real photo samples.
      
      Testing Focus:
      - Photo type detection accuracy
      - Rule validation correctness
      - Error handling and edge cases
      - Integration with existing services
    
    deliverables:
      - Test coverage report for ValidationService
      - Integration tests with sample photos
      - Edge case validation tests
      - Performance benchmarks
    
    acceptance_criteria:
      - Test coverage >90% for ValidationService
      - All existing pipeline tests still pass
      - Photo type detection 100% accurate on test samples
      - Validation completes under 50ms per photo
      - No memory leaks or performance regressions

  # Phase 2: Scoring and Rules Engine
  - id: "scoring_rules_engine"
    phase_name: "Scoring and Rules Engine"
    assigned_to: "claude-2"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "4-5 days"
    depends_on: ["qa_foundation_validation"]
    
    description: |
      Implement weighted scoring system and complete rule sets for both photo types.
      
      Implementation Focus:
      - Weighted scoring calculation (critical/quality/bonus rules)
      - Complete post-digital rule set (7 critical + 4 quality + 2 bonus)
      - Complete heritage-scan rule set (6 critical + 3 quality + 3 expected)
      - Configurable pass thresholds
      - Detailed scoring breakdown
    
    deliverables:
      - Complete rule sets for both photo types
      - Weighted scoring implementation
      - Rule configuration system
      - Extended ValidationService with scoring
    
    acceptance_criteria:
      - All 13 post-digital rules implemented and tested
      - All 12 heritage-scan rules implemented and tested
      - Weighted scoring produces expected results
      - Configurable thresholds working
      - Rule failures properly categorized

  # QA Phase 2: Scoring and Rules Testing
  - id: "qa_scoring_rules"
    phase_name: "QA Scoring and Rules"
    assigned_to: "claude-3"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "2 days"
    depends_on: ["scoring_rules_engine"]
    
    description: |
      Test scoring accuracy and rule validation across diverse photo samples.
      
      Testing Focus:
