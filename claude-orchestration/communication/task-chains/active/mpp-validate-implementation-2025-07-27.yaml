      - Rule validation correctness for all rules
      - Threshold behavior validation
      - Edge cases and boundary conditions
    
    deliverables:
      - Comprehensive rule validation test suite
      - Scoring accuracy validation
      - Test with heritage and modern photo samples
      - Performance testing with batch validation
    
    acceptance_criteria:
      - All rules validated with sample photos
      - Scoring calculations match expected results
      - Heritage vs post-digital detection 100% accurate
      - Batch validation performs adequately
      - Test coverage maintained >90%

  # Phase 3: Auto-Fix Implementation
  - id: "auto_fix_implementation"
    phase_name: "Auto-Fix Implementation"
    assigned_to: "claude-2"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "5-6 days"
    depends_on: ["qa_scoring_rules"]
    
    description: |
      Implement AutoFixService with safe auto-repair capabilities.
      
      Implementation Focus:
      - AutoFixService class with safe fix implementations
      - File backup system before modifications
      - Integration with existing pipeline processing for sidecar generation
      - Filename correction based on EXIF dates
      - GPS enrichment for existing coordinates
      - Color analysis re-extraction
    
    deliverables:
      - "pipeline-cli/src/services/validation/AutoFixService.ts"
      - Safe fix implementations for common issues
      - Backup and rollback system
      - Fix status reporting
    
    acceptance_criteria:
      - Can fix missing_sidecar by running pipeline processing
      - Can fix filename_date_mismatch with proper renaming
      - Can fix missing_color_analysis by re-extraction
      - Can fix missing_gps_enrichment for existing GPS data
      - All fixes create backups before modification
      - Fix rollback works correctly
      - No data loss during fix operations

  # QA Phase 3: Auto-Fix Testing
  - id: "qa_auto_fix"
    phase_name: "QA Auto-Fix"
    assigned_to: "claude-3"
    status: "pending"
    priority: "HIGH"
    estimated_duration: "2-3 days"
    depends_on: ["auto_fix_implementation"]
    
    description: |
